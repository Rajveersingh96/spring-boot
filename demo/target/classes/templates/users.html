<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Products</title>
</head>

<body>

<h1>Product List</h1>

<a href="/users/add">Add Product</a>

<br><br>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Product Name</th>
        <th>Product Price</th>
        <th>Action</th>
    </tr>

    <tr th:each="user : ${users}">

        <td th:text="${user.id}"></td>

        <td th:text="${user.name}"></td>

        <td th:text="${user.price}"></td>

        <td>
            <a th:href="@{/users/edit/{id}(id=${user.id})}">
                Edit
            </a>

            |

            <a th:href="@{/users/delete/{id}(id=${user.id})}">
                Delete
            </a>
        </td>

    </tr>

</table>

</body>
</html>
